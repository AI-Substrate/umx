[package]
name = "umx-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
umx-core.workspace = true
umx-graph.workspace = true
# umx query (req-27, ws005 s04); no type of the fork crosses umx-query's API.
umx-query.workspace = true

[features]
# Timing only, enabled by umx-bench; not a production entry point.
bench = []
# Test-only read access to a loaded graph (Services::loaded_graph). Only this crate's own tests enable it, through
# the dev-dependency on itself below; no shipped crate may (architect).
test-hooks = []

[dev-dependencies]
umx-services = { workspace = true, features = ["test-hooks"] }
umx-fakes.workspace = true
serde_json = { workspace = true, features = ["alloc"] }
umx-adapter-fs.workspace = true
