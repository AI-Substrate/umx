# pnpm 10 settings for apps/ui (plan 159, D72h). Quarantine: pnpm resolves no version published less than 7 days ago
# (10080 minutes); a frozen install does not check it, so scripts/check-lock-ages.mjs checks the lock against the same
# number. scripts/check-quarantine.mjs fails `just ui-check` if this is missing or lower. No minimumReleaseAgeExclude:
# an exception is one exact name@version, allowed only for a named security fix, with a reason comment on its line and
# a security verdict, and removed after 7 days (crates/umx-cli/docs/ui.md).
minimumReleaseAge: 10080
